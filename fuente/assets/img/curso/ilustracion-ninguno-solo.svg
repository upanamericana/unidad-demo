<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="Cuatro tarjetas, dos a cada lado: el equipo, con el tablero que construyó; el área médica, con una carpeta marcada con una cruz; la gerencia, con el reporte que le llega; y el área de datos, con dos bases de datos. De cada una sale una línea punteada hacia el centro y ninguna llega. En el centro, una hoja rotulada «atención», sin nada escrito, con la línea de la firma vacía y el lugar del sello vacío, y el contorno punteado en dorado.">
  <!-- Ilustración de marca · Posgrados Panamericana · unidad-demo, tema 1 · cuerpo (Respuesta del caso Red Salud Wari)
       UP-001 T7 (D9): la misma idea aprobada en Andina, redibujada en la familia de UP (INSTITUCION.md §1.7, §1.4):
       plana, geométrica, sin trazo en las figuras, tarjetas blancas de 4 px, líneas rectas (sin curvas).
       Contracara de ilustracion-quien-decide.svg: allí la hoja con lo que se decide, la firma y el sello; aquí la hoja vacía.
       Rótulos literales: los cuatro candidatos de la Pregunta y «atención» de la Respuesta.
       Único dorado: el contorno punteado de la hoja vacía, «el vacío que el gobierno de datos viene a llenar».
       El Tahalí lo pone la piel, no el SVG. Guion en insumos/ILUSTRACIONES.md. -->
  <defs>
    <linearGradient id="ilu-ninguno-solo-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E4EEEB"/>
      <stop offset="55%"  stop-color="#ECF1EF"/>
      <stop offset="100%" stop-color="#F6F8F7"/>
    </linearGradient>
    <filter id="ilu-ninguno-solo-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A4039" flood-opacity="0.14"/>
    </filter>
    <g id="ilu-ninguno-solo-persona">
      <circle cx="0" cy="0" r="14"/>
      <polygon points="-26,72 -20,22 20,22 26,72"/>
    </g>
    <g id="ilu-ninguno-solo-persona-chica">
      <circle cx="0" cy="0" r="10"/>
      <polygon points="-18,46 -14,16 14,16 18,46"/>
    </g>
  </defs>

  <rect width="1200" height="440" rx="4" fill="url(#ilu-ninguno-solo-fondo)"/>

  <!-- Las cuatro tarjetas y la hoja de la regla -->
  <g filter="url(#ilu-ninguno-solo-sombra)">
    <rect x="48"  y="56"  width="300" height="150" rx="4" fill="#FFFFFF"/>
    <rect x="48"  y="234" width="300" height="150" rx="4" fill="#FFFFFF"/>
    <rect x="852" y="56"  width="300" height="150" rx="4" fill="#FFFFFF"/>
    <rect x="852" y="234" width="300" height="150" rx="4" fill="#FFFFFF"/>
    <polygon points="520,80 652,80 680,108 680,360 520,360" fill="#FFFFFF"/>
  </g>

  <!-- ══ el equipo: el tablero que construyó ══ -->
  <rect x="84" y="72" width="124" height="78" rx="4" fill="#0F5C51"/>
  <rect x="96" y="84" width="100" height="54" rx="2" fill="#FFFFFF"/>
  <rect x="106" y="116" width="12" height="16" rx="2" fill="#3F7D74"/>
  <rect x="124" y="106" width="12" height="26" rx="2" fill="#3F7D74"/>
  <rect x="142" y="96"  width="12" height="36" rx="2" fill="#0F5C51"/>
  <rect x="162" y="92"  width="26" height="6"  rx="2" fill="#0A4039"/>
  <rect x="162" y="104" width="20" height="4"  rx="2" fill="#CFE0DC"/>
  <rect x="162" y="114" width="24" height="4"  rx="2" fill="#CFE0DC"/>
  <rect x="139" y="150" width="14" height="8"  fill="#0A4039"/>
  <rect x="122" y="158" width="48" height="6"  rx="2" fill="#0A4039"/>
  <g fill="#3F7D74">
    <use href="#ilu-ninguno-solo-persona-chica" xlink:href="#ilu-ninguno-solo-persona-chica" x="252" y="100"/>
    <use href="#ilu-ninguno-solo-persona-chica" xlink:href="#ilu-ninguno-solo-persona-chica" x="298" y="100"/>
  </g>

  <!-- ══ el área médica: la carpeta con la cruz ══ -->
  <rect x="96"  y="252" width="42"  height="14" rx="2" fill="#0A4039"/>
  <rect x="96"  y="262" width="104" height="80" rx="4" fill="#0F5C51"/>
  <rect x="142" y="282" width="12"  height="40" fill="#FFFFFF"/>
  <rect x="128" y="296" width="40"  height="12" fill="#FFFFFF"/>
  <g fill="#3F7D74">
    <use href="#ilu-ninguno-solo-persona-chica" xlink:href="#ilu-ninguno-solo-persona-chica" x="252" y="278"/>
    <use href="#ilu-ninguno-solo-persona-chica" xlink:href="#ilu-ninguno-solo-persona-chica" x="298" y="278"/>
  </g>

  <!-- ══ la gerencia: el reporte que le llega ══ -->
  <rect x="888" y="76" width="60" height="76" rx="4" fill="#CFE0DC"/>
  <rect x="898" y="88" width="30" height="6" rx="2" fill="#0A4039"/>
  <rect x="898" y="100" width="40" height="4" rx="2" fill="#3F7D74"/>
  <rect x="900" y="126" width="9" height="16" rx="2" fill="#0F5C51" opacity=".55"/>
  <rect x="914" y="118" width="9" height="24" rx="2" fill="#0F5C51" opacity=".78"/>
  <rect x="928" y="110" width="9" height="32" rx="2" fill="#0F5C51"/>
  <!-- llega a quien lo recibe: la punta se detiene antes de la persona -->
  <path d="M960 114 H1000" fill="none" stroke="#3F7D74" stroke-width="3" stroke-linecap="butt"/>
  <polygon points="998,106 1012,114 998,122" fill="#3F7D74"/>
  <use href="#ilu-ninguno-solo-persona" xlink:href="#ilu-ninguno-solo-persona" x="1066" y="86" fill="#0F5C51"/>

  <!-- ══ el área de datos: los sistemas que administra ══ -->
  <g>
    <ellipse cx="920" cy="320" rx="30" ry="9" fill="#0F5C51"/>
    <rect x="890" y="266" width="60" height="54" fill="#0F5C51"/>
    <rect x="890" y="290" width="60" height="4" fill="#3F7D74"/>
    <ellipse cx="920" cy="266" rx="30" ry="9" fill="#CFE0DC"/>
  </g>
  <g>
    <ellipse cx="990" cy="320" rx="30" ry="9" fill="#0A4039"/>
    <rect x="960" y="266" width="60" height="54" fill="#0A4039"/>
    <rect x="960" y="290" width="60" height="4" fill="#3F7D74"/>
    <ellipse cx="990" cy="266" rx="30" ry="9" fill="#CFE0DC"/>
  </g>
  <g fill="#3F7D74">
    <use href="#ilu-ninguno-solo-persona-chica" xlink:href="#ilu-ninguno-solo-persona-chica" x="1062" y="278"/>
    <use href="#ilu-ninguno-solo-persona-chica" xlink:href="#ilu-ninguno-solo-persona-chica" x="1108" y="278"/>
  </g>

  <!-- Las cuatro líneas hacia el centro: ninguna llega a la hoja -->
  <g fill="none" stroke="#3F7D74" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="butt">
    <path d="M362 131 H458"/>
    <path d="M362 309 H458"/>
    <path d="M838 131 H742"/>
    <path d="M838 309 H742"/>
  </g>

  <!-- ══ Centro · la regla que define la métrica de atención: vacía ══ -->
  <polygon points="652,80 652,108 680,108" fill="#ECF1EF"/>
  <!-- ÚNICO DORADO: el contorno punteado de la hoja vacía -->
  <polygon points="520,80 652,80 680,108 680,360 520,360" fill="none"
           stroke="#B9975B" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="miter"/>
  <text x="600" y="128" text-anchor="middle" font-family="Seravek, 'Source Sans 3', system-ui, sans-serif"
        font-size="17" font-weight="600" fill="#0A4039">atención</text>
  <rect x="556" y="140" width="88" height="3" fill="#CFE0DC"/>
  <!-- sin firma: la línea, vacía -->
  <rect x="540" y="326" width="74" height="2" fill="#5F6663"/>
  <!-- sin sello: el lugar, vacío -->
  <circle cx="648" cy="314" r="16" fill="none" stroke="#5F6663" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Los cuatro candidatos, literales de la Pregunta -->
  <g font-family="Seravek, 'Source Sans 3', system-ui, sans-serif" font-size="17" font-weight="600" fill="#0A4039" text-anchor="middle">
    <text x="198"  y="190">el equipo</text>
    <text x="198"  y="368">el área médica</text>
    <text x="1002" y="190">la gerencia</text>
    <text x="1002" y="368">el área de datos</text>
  </g>
</svg>
